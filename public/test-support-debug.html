<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Feedback Debug Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3e3e42;
        }
        h1 {
            color: #4ec9b0;
            margin-bottom: 20px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
        }
        button:hover {
            background: #1177bb;
        }
        .log {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #2d2d30;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .timestamp {
            color: #858585;
        }
        .info { color: #4ec9b0; }
        .success { color: #4ec9b0; font-weight: bold; }
        .error { color: #f48771; font-weight: bold; }
        .warning { color: #dcdcaa; }
        .data { 
            color: #ce9178; 
            margin-left: 20px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Support Feedback Debug Console</h1>
        
        <div>
            <button onclick="runTest()">🧪 Run Test</button>
            <button onclick="testEndpoint()">📡 Test Endpoint</button>
            <button onclick="checkDatabase()">💾 Check Database Connection</button>
            <button onclick="clearLog()">🗑️ Clear Log</button>
        </div>

        <div id="log" class="log">
            <div class="log-entry info">Ready to test. Click "Run Test" to begin.</div>
        </div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            addLog('Log cleared', 'info');
        }

        async function testEndpoint() {
            addLog('🔍 Testing API endpoint availability...', 'info');
            
            try {
                const response = await fetch('/api/support/feedback', {
                    method: 'OPTIONS'
                });
                
                addLog(`Endpoint responded with status: ${response.status}`, 'success');
                addLog(`Response headers: ${JSON.stringify([...response.headers])}`, 'data');
            } catch (error) {
                addLog(`❌ Endpoint test failed: ${error.message}`, 'error');
                addLog(`Error details: ${error.stack}`, 'data');
            }
        }

        async function checkDatabase() {
            addLog('💾 Checking database connectivity...', 'info');
            
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                if (response.ok) {
                    addLog('✅ Health endpoint responded', 'success');
                    addLog(`Response: ${JSON.stringify(data, null, 2)}`, 'data');
                } else {
                    addLog(`⚠️ Health check returned: ${response.status}`, 'warning');
                }
            } catch (error) {
                addLog(`❌ Health check failed: ${error.message}`, 'error');
            }
        }

        async function runTest() {
            addLog('🧪 Starting support feedback test...', 'info');
            
            const testData = {
                name: 'Debug Test User',
                email: 'debug@test.com',
                subject: 'Debug Test - ' + new Date().toISOString(),
                category: 'technical-issue',
                priority: 'normal',
                message: 'This is a debug test message to verify database integration.'
            };

            addLog('📤 Preparing test data...', 'info');
            addLog(JSON.stringify(testData, null, 2), 'data');

            try {
                addLog('📡 Sending POST request to /api/support/feedback...', 'info');
                
                const startTime = performance.now();
                const response = await fetch('/api/support/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                const endTime = performance.now();
                
                addLog(`⏱️ Request completed in ${(endTime - startTime).toFixed(2)}ms`, 'info');
                addLog(`📊 Response status: ${response.status} ${response.statusText}`, 
                    response.ok ? 'success' : 'error');
                
                addLog('📥 Reading response body...', 'info');
                const responseText = await response.text();
                addLog(`Raw response: ${responseText}`, 'data');
                
                try {
                    const data = JSON.parse(responseText);
                    
                    if (response.ok && data.success) {
                        addLog('✅ TEST PASSED!', 'success');
                        addLog(`Feedback ID: ${data.feedbackId}`, 'success');
                        addLog(`Message: ${data.message}`, 'info');
                        addLog('', 'info');
                        addLog('🔍 Verify in Neon database with:', 'info');
                        addLog(`SELECT * FROM user_feedback WHERE id = '${data.feedbackId}';`, 'data');
                        addLog('', 'info');
                        addLog('📊 Test Summary:', 'success');
                        addLog('  ✓ API endpoint: OK', 'success');
                        addLog('  ✓ Data validation: OK', 'success');
                        addLog('  ✓ Database write: OK', 'success');
                        addLog('  ✓ Response format: OK', 'success');
                    } else {
                        addLog('❌ TEST FAILED!', 'error');
                        addLog(`Error: ${data.error || 'Unknown error'}`, 'error');
                        addLog('Full response:', 'error');
                        addLog(JSON.stringify(data, null, 2), 'data');
                    }
                } catch (parseError) {
                    addLog('❌ Failed to parse response as JSON', 'error');
                    addLog(`Parse error: ${parseError.message}`, 'error');
                }
                
            } catch (error) {
                addLog('❌ TEST FAILED WITH EXCEPTION!', 'error');
                addLog(`Error: ${error.message}`, 'error');
                addLog(`Error type: ${error.constructor.name}`, 'error');
                addLog(`Stack trace:`, 'error');
                addLog(error.stack, 'data');
                
                if (error.message.includes('fetch')) {
                    addLog('', 'error');
                    addLog('💡 Troubleshooting tips:', 'warning');
                    addLog('  • Check if dev server is running on port 3002', 'warning');
                    addLog('  • Verify the API route exists at /api/support/feedback', 'warning');
                    addLog('  • Check browser console for CORS errors', 'warning');
                    addLog('  • Ensure DATABASE_URL is configured in .env.local', 'warning');
                }
            }
        }

        // Log initial info
        addLog(`Browser: ${navigator.userAgent}`, 'info');
        addLog(`Current URL: ${window.location.href}`, 'info');
        addLog(`API Base: ${window.location.origin}`, 'info');
    </script>
</body>
</html>
